[project]
name = "parchi"
version = "0.1.0"
description = "Health record agent for family caregivers — reconciliation core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
fixtures = ["huggingface_hub>=0.20", "pyarrow>=15", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
