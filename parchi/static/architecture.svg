<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="908" viewBox="0 0 1180 908" role="img" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title>Parchi architecture</title>
<desc>Layered architecture. Two interfaces on Cloud Run, a Google ADK agent fleet, a deterministic core containing no model call, and storage entirely within asia-south1. Gemini 3.5 Flash is reached from one place only: the extraction harness, which reads each document three times and derives confidence from whether the reads agree.</desc>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="1180" height="908" fill="#FBFAF7"/>

<text x="30" y="42" font-size="24" font-weight="500" fill="#16213A">Parchi — architecture</text>
<text x="30" y="66" font-size="13" fill="#6E6A61">Every component below runs in asia-south1 (Mumbai). The judgement layer contains no model call.</text>

<!-- ============ PEOPLE ============ -->
<text x="30" y="104" font-size="10.5" letter-spacing="1.6" fill="#6E6A61">PEOPLE</text>
<g>
  <rect x="30" y="114" width="360" height="58" rx="6" fill="#EDE9F5" stroke="#8E7CC3" stroke-width="1"/>
  <text x="46" y="139" font-size="14" font-weight="500" fill="#3D2E63">Coordinating caregiver</text>
  <text x="46" y="158" font-size="12" fill="#5A4A85">adult child, metro or overseas · forwards photographs</text>
</g>
<g>
  <rect x="410" y="114" width="360" height="58" rx="6" fill="#EDE9F5" stroke="#8E7CC3" stroke-width="1"/>
  <text x="426" y="139" font-size="14" font-weight="500" fill="#3D2E63">Prescriber</text>
  <text x="426" y="158" font-size="12" fill="#5A4A85">seven-minute consultation · not a customer, a channel</text>
</g>

<line x1="210" y1="172" x2="210" y2="212" stroke="#8E7CC3" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="590" y1="172" x2="590" y2="212" stroke="#8E7CC3" stroke-width="1.4" marker-end="url(#a)"/>

<!-- ============ INTERFACES ============ -->
<text x="30" y="204" font-size="10.5" letter-spacing="1.6" fill="#6E6A61">INTERFACES · CLOUD RUN, SCALES TO ZERO</text>
<rect x="30" y="212" width="740" height="122" rx="8" fill="#F4F2EC" stroke="#D8D4CB"/>
<g>
  <rect x="46" y="228" width="330" height="52" rx="5" fill="#FBFAF7" stroke="#B6B1A6"/>
  <text x="60" y="250" font-size="13.5" font-weight="500" fill="#16213A">Chat interface &#8201;/</text>
  <text x="60" y="268" font-size="11.5" fill="#6E6A61">current list · open questions · ask anything</text>
</g>
<g>
  <rect x="426" y="228" width="330" height="52" rx="5" fill="#FBFAF7" stroke="#B6B1A6"/>
  <text x="440" y="250" font-size="13.5" font-weight="500" fill="#16213A">Case history &#8201;/d/{patient}</text>
  <text x="440" y="268" font-size="11.5" fill="#6E6A61">six counts, two sections, detail behind a tap</text>
</g>
<g>
  <rect x="46" y="292" width="710" height="30" rx="5" fill="#F6E9E5" stroke="#A63A2B"/>
  <text x="60" y="312" font-size="12" fill="#7E2C20"><tspan font-weight="500">safe_reply</tspan> — screens prose on the way out. SR-1 is structural for findings; it cannot reach free text.</text>
</g>

<line x1="210" y1="334" x2="210" y2="374" stroke="#73726C" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="590" y1="334" x2="590" y2="374" stroke="#73726C" stroke-width="1.4" marker-end="url(#a)"/>

<!-- ============ ADK FLEET ============ -->
<text x="30" y="366" font-size="10.5" letter-spacing="1.6" fill="#6E6A61">AGENT FLEET · GOOGLE ADK 2.7</text>
<rect x="30" y="374" width="740" height="146" rx="8" fill="#E8F0EE" stroke="#3F8375"/>
<g>
  <rect x="46" y="390" width="710" height="42" rx="5" fill="#FBFAF7" stroke="#3F8375"/>
  <text x="60" y="416" font-size="13.5" fill="#1E4A42"><tspan font-weight="500">coordinator</tspan> &#183; routes to a specialist, answers in plain language, one question at a time</text>
</g>
<g>
  <rect x="46" y="444" width="226" height="60" rx="5" fill="#FBFAF7" stroke="#3F8375"/>
  <text x="60" y="466" font-size="13" font-weight="500" fill="#1E4A42">ingest</text>
  <text x="60" y="484" font-size="11.5" fill="#4A6B64">list documents</text>
  <text x="60" y="499" font-size="11.5" fill="#4A6B64">read document</text>
</g>
<g>
  <rect x="288" y="444" width="226" height="60" rx="5" fill="#FBFAF7" stroke="#3F8375"/>
  <text x="302" y="466" font-size="13" font-weight="500" fill="#1E4A42">records</text>
  <text x="302" y="484" font-size="11.5" fill="#4A6B64">medications · questions · trends</text>
  <text x="302" y="499" font-size="11.5" fill="#4A6B64">confirm reading</text>
</g>
<g>
  <rect x="530" y="444" width="226" height="60" rx="5" fill="#FBFAF7" stroke="#3F8375"/>
  <text x="544" y="466" font-size="13" font-weight="500" fill="#1E4A42">brief</text>
  <text x="544" y="484" font-size="11.5" fill="#4A6B64">upcoming appointments</text>
  <text x="544" y="499" font-size="11.5" fill="#4A6B64">appointment brief</text>
</g>

<line x1="400" y1="520" x2="400" y2="560" stroke="#73726C" stroke-width="1.4" marker-end="url(#a)"/>
<text x="412" y="546" font-size="11.5" fill="#6E6A61">tools call the core; the core never calls back</text>

<!-- ============ DETERMINISTIC CORE ============ -->
<text x="30" y="552" font-size="10.5" letter-spacing="1.6" fill="#6E6A61">CORE</text>
<rect x="30" y="560" width="740" height="164" rx="8" fill="#FBFAF7" stroke="#16213A" stroke-width="1.6"/>
<text x="46" y="582" font-size="12.5" font-weight="500" fill="#16213A">No model call below this line. Pure, deterministic, fully tested.</text>

<g>
  <rect x="46" y="594" width="226" height="56" rx="5" fill="#F4F2EC" stroke="#B6B1A6"/>
  <text x="60" y="616" font-size="13" font-weight="500" fill="#16213A">drugs.py</text>
  <text x="60" y="634" font-size="11.5" fill="#6E6A61">brand &#8594; molecules, or a question</text>
</g>
<g>
  <rect x="288" y="594" width="226" height="56" rx="5" fill="#F4F2EC" stroke="#B6B1A6"/>
  <text x="302" y="616" font-size="13" font-weight="500" fill="#16213A">labs.py</text>
  <text x="302" y="634" font-size="11.5" fill="#6E6A61">units normalised, factors cited</text>
</g>
<g>
  <rect x="530" y="594" width="226" height="56" rx="5" fill="#F4F2EC" stroke="#B6B1A6"/>
  <text x="544" y="616" font-size="13" font-weight="500" fill="#16213A">brief.py</text>
  <text x="544" y="634" font-size="11.5" fill="#6E6A61">six sections, every claim sourced</text>
</g>
<g>
  <rect x="46" y="662" width="710" height="48" rx="5" fill="#E6EFE9" stroke="#2F6B52" stroke-width="1.4"/>
  <text x="60" y="682" font-size="13.5" fill="#1E4632"><tspan font-weight="500">reconcile.py</tspan> &#183; omission counts as a stop only from the same prescriber, in a comprehensive rewrite</text>
  <text x="60" y="700" font-size="11.5" fill="#3D6B57">pure and deterministic · takes `as_of` as an argument, reads no clock · output is a question, never a conclusion</text>
</g>

<line x1="400" y1="724" x2="400" y2="764" stroke="#73726C" stroke-width="1.4" marker-end="url(#a)"/>

<!-- ============ STORAGE ============ -->
<text x="30" y="756" font-size="10.5" letter-spacing="1.6" fill="#6E6A61">STORAGE · asia-south1 (BR-19: HEALTH DATA STAYS IN INDIA)</text>
<rect x="30" y="764" width="740" height="112" rx="8" fill="#F4F2EC" stroke="#D8D4CB"/>
<g>
  <rect x="46" y="780" width="350" height="52" rx="5" fill="#FBFAF7" stroke="#B6B1A6"/>
  <text x="60" y="802" font-size="13.5" font-weight="500" fill="#16213A">Firestore &#8201;· native mode</text>
  <text x="60" y="820" font-size="11.5" fill="#6E6A61">documents · mentions · lab results · corrections</text>
</g>
<g>
  <rect x="406" y="780" width="350" height="52" rx="5" fill="#FBFAF7" stroke="#B6B1A6"/>
  <text x="420" y="802" font-size="13.5" font-weight="500" fill="#16213A">Cloud Storage</text>
  <text x="420" y="820" font-size="11.5" fill="#6E6A61">document images · deleted with the patient</text>
</g>
<text x="46" y="852" font-size="11.5" fill="#A63A2B">Observations only. No medication state, finding or brief is ever stored.</text>
<text x="46" y="868" font-size="11.5" fill="#A63A2B">All of it recomputes in microseconds, so it cannot drift from its evidence.</text>

<!-- ============ RIGHT RAIL ============ -->
<line x1="800" y1="100" x2="800" y2="876" stroke="#D8D4CB" stroke-dasharray="3 4"/>

<text x="826" y="104" font-size="10.5" letter-spacing="1.6" fill="#6E6A61">MODEL · ONE CALLER</text>
<g>
  <rect x="826" y="114" width="324" height="126" rx="8" fill="#FFF4E0" stroke="#B0821F"/>
  <text x="842" y="138" font-size="13.5" font-weight="500" fill="#6E4E0E">Gemini 3.5 Flash</text>
  <text x="842" y="156" font-size="11.5" fill="#7C5D18">Vertex AI · asia-south1</text>
  <text x="842" y="180" font-size="11.5" fill="#7C5D18">thinkingBudget: 0 — measured at 22&#215;</text>
  <text x="842" y="196" font-size="11.5" fill="#7C5D18">the cost for a gain landing on one</text>
  <text x="842" y="212" font-size="11.5" fill="#7C5D18">image in ten</text>
  <text x="842" y="232" font-size="11.5" font-weight="500" fill="#6E4E0E">$0.0162 per document</text>
</g>

<text x="826" y="272" font-size="10.5" letter-spacing="1.6" fill="#6E6A61">EXTRACTION · THE ONLY MODEL CALLER</text>
<g>
  <rect x="826" y="282" width="324" height="150" rx="8" fill="#FBFAF7" stroke="#16213A" stroke-width="1.6"/>
  <text x="842" y="306" font-size="13.5" font-weight="500" fill="#16213A">extract.py</text>
  <text x="842" y="326" font-size="11.5" fill="#6E6A61">Three independently framed reads:</text>
  <text x="842" y="344" font-size="11.5" fill="#6E6A61">a list · line-by-line · a pharmacist</text>
  <text x="842" y="362" font-size="11.5" fill="#6E6A61">dispensing from the page</text>
  <text x="842" y="386" font-size="11.5" fill="#16213A">Agreement, not self-report, sets</text>
  <text x="842" y="402" font-size="11.5" fill="#16213A">confidence. The model said HIGH</text>
  <text x="842" y="418" font-size="11.5" fill="#16213A">on 342 of 382 lines.</text>
</g>
<line x1="988" y1="282" x2="988" y2="242" stroke="#B0821F" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1000" y="266" font-size="11" fill="#7C5D18">3 calls</text>

<text x="826" y="466" font-size="10.5" letter-spacing="1.6" fill="#6E6A61">UNPROMPTED · NO MODEL AT ALL</text>
<g>
  <rect x="826" y="476" width="324" height="132" rx="8" fill="#E6EFE9" stroke="#2F6B52"/>
  <text x="842" y="500" font-size="13.5" font-weight="500" fill="#1E4632">Cloud Scheduler</text>
  <text x="842" y="518" font-size="11.5" fill="#3D6B57">POST /api/sweep, token-gated</text>
  <text x="842" y="542" font-size="11.5" fill="#3D6B57">Finds a follow-up date read off a</text>
  <text x="842" y="558" font-size="11.5" fill="#3D6B57">prescription months earlier and</text>
  <text x="842" y="574" font-size="11.5" fill="#3D6B57">builds the brief. Nobody asks.</text>
  <text x="842" y="596" font-size="11.5" fill="#1E4632">Arithmetic on a timer needs no LLM.</text>
</g>

<text x="826" y="642" font-size="10.5" letter-spacing="1.6" fill="#6E6A61">SAFETY</text>
<g>
  <rect x="826" y="652" width="324" height="224" rx="8" fill="#F6E9E5" stroke="#A63A2B"/>
  <text x="842" y="676" font-size="12.5" font-weight="500" fill="#7E2C20">Four invariants are structural,</text>
  <text x="842" y="692" font-size="12.5" font-weight="500" fill="#7E2C20">not asserted</text>
  <text x="842" y="716" font-size="11.5" fill="#8A3A2A">A Finding carrying clinical-claim</text>
  <text x="842" y="732" font-size="11.5" fill="#8A3A2A">vocabulary cannot be constructed.</text>
  <text x="842" y="754" font-size="11.5" fill="#8A3A2A">A MedicationState cannot exist</text>
  <text x="842" y="770" font-size="11.5" fill="#8A3A2A">without evidence.</text>
  <text x="842" y="792" font-size="11.5" fill="#8A3A2A">A partially attributed strength is</text>
  <text x="842" y="808" font-size="11.5" fill="#8A3A2A">refused by the model layer.</text>
  <text x="842" y="836" font-size="11.5" fill="#8A3A2A">An unconfirmed reading never</text>
  <text x="842" y="852" font-size="11.5" fill="#8A3A2A">reaches a medication list, whatever</text>
  <text x="842" y="868" font-size="11.5" fill="#8A3A2A">the model claimed about it.</text>
</g>
</svg>
